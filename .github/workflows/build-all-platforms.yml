name: Build Desktop, Android and iPad Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows desktop
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows project
        run: flutter create --platforms=windows .
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Chayan-Entertainment-Windows.zip -Force
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Chayan-Entertainment-Windows
          path: Chayan-Entertainment-Windows.zip
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android .
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Chayan-Entertainment-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  build-ipad:
    name: Build iPadOS app
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project
        run: flutter create --platforms=ios .
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package iPadOS app
        run: cd build/ios/iphoneos && zip -r "$GITHUB_WORKSPACE/Chayan-Entertainment-iPadOS-unsigned.zip" Runner.app
      - name: Upload iPadOS app
        uses: actions/upload-artifact@v4
        with:
          name: Chayan-Entertainment-iPadOS-unsigned
          path: Chayan-Entertainment-iPadOS-unsigned.zip
          if-no-files-found: error
          retention-days: 30
