name: Build Windows Desktop App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package app
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Chayan-Entertainment-Windows.zip -Force
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Chayan-Entertainment-Windows
          path: Chayan-Entertainment-Windows.zip
          if-no-files-found: error
          retention-days: 30
